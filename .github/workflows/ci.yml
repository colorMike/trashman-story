name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run lint:amo
      - uses: actions/upload-artifact@v4
        with:
          name: extension-zips
          path: dist/*.zip
